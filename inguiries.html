<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAYAN AI | Inquiries</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0d0907; /* اللون البني الداكن الخاص بموقعك */
            color: #e5d5c5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 80px;
            background-color: #0d0907;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #d1b190;
        }

        .nav-links a {
            color: #a89a8e;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #d1b190;
        }

        /* Form Section */
        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            width: 90%;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 2.2rem;
            color: #d1b190;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .form-header p {
            color: #a89a8e;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #d1b190;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            background-color: #16100c;
            border: 1px solid #2e231c;
            color: #e5d5c5;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #d1b190;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #d1b190; /* لون الزر النحاسي/الذهبي */
            color: #0d0907;
            border: none;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #b89877;
        }
    </style>
</head>
<body>

    <!-- القائمة العلويّة -->
    <nav>
        <div class="logo">QAYAN AI</div>
        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="inquiries.html" class="active">INQUIRIES</a>
            <a href="contact.html">CONTACT US</a>
        </div>
    </nav>

    <!-- نموذج الاستفسارات -->
    <div class="container">
        <div class="form-header">
            <h1>INQUIRIES</h1>
            <p>Have questions about our AI solutions? Send us your message below.</p>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Select Inquiry Type</option>
                    <option value="general">General Inquiry</option>
                    <option value="solutions">AI Solutions & Services</option>
                    <option value="partnership">Partnership</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">SEND MESSAGE →</button>
        </form>
    </div>

</body>
</html>
